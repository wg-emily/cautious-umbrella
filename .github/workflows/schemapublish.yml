name: Publish Schema

on:
  pull_request:
    branches:
      - main     # The target branch (base)
    types:
      - closed   # Triggers when a PR is closed or merged

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "lts/*"

      - name: Install Cosmo CLI
        run: |
          npm install -g wgc@latest

      - name: Publish Schema
        env: # add auth token as env variable
          COSMO_API_KEY: ${{ secrets.COSMO_API_KEY }}
        run: |
          wgc subgraph publish employees --schema ./schema.graphqls --namespace development
